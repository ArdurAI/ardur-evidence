[build-system]
requires = ["setuptools==84.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ardur"
version = "0.2.0"
description = "Runtime governance and signed evidence for AI agent tool calls"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Gnani Rahul Nutakki", email = "gnani.nutakki@gmail.com" }
]
keywords = ["ai-agents", "governance", "runtime-policy", "security", "attestation", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "PyJWT>=2.12.0,<3",
    "cryptography>=41.0,<51",
    # Receipt ids, digests, and v0.2 JWS payloads claim RFC 8785 JCS. A real
    # implementation is required because sorted stdlib JSON does not implement
    # ECMAScript number formatting or UTF-16 property ordering.
    "rfc8785>=0.1.4,<0.2",
    # jsonschema moved out of [dev] on 2026-04-28: the Mission Declaration
    # loader now validates fetched MDs against the v0.1 spec at the network
    # boundary (FIX-3 from S2 hostile audit). Validation is a security
    # boundary, not an opt-in dev convenience, so the validator must be
    # present in every install.
    "jsonschema>=4.0,<5",
    # psutil is used by the host-observer capture tier to enumerate child
    # processes of the launched agent. It is a cross-platform, zero-privilege
    # dependency that does not require kernel support.
    "psutil>=5.9.0,<8",
    # SPIFFE workload identity and Biscuit capabilities are imported by
    # supported runtime modules and proxy paths, so plain installs must carry
    # them rather than relying on the development extra.
    "biscuit-python==0.4.0",
    "spiffe>=0.2,<0.4",
    # spiffe's ASN.1 dependency must stay above the three network-DoS fixes in
    # pyasn1 0.6.4 (CVE-2026-59884, CVE-2026-59885, CVE-2026-59886).
    "pyasn1>=0.6.4,<0.7",
]

[project.optional-dependencies]
dev = [
    "build==1.5.0",
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<8",
    "setuptools==84.0.0",
    "wheel==0.47.0",
    "PyYAML>=6.0,<7",
    "cedarpy>=4.0,<6",
    "z3-solver>=4.16,<6",
    "mcp>=1.23.0,<3",
    "python-multipart>=0.0.26,<1",
]
langgraph = [
    # The governed-subagent reference uses invocation runtime context and
    # ToolRuntime injection introduced on the current LangChain/LangGraph API.
    "langchain>=1.3.13,<2",
    "langgraph>=1.2.9,<2",
]
ollama = [
    # Optional client used only by the credentialed E2E showcase
    # (tests/test_e2e_showcase.py) against a real Ollama cloud model. Bounded
    # below 1.0 because the showcase calls `.chat()` on a stable client API;
    # a 1.0 major bump would need an explicit compatibility review before
    # the showcase job can adopt it. Not a runtime dependency: `pip install
    # ardur` never pulls a network LLM client.
    "ollama>=0.4.0,<1",
]

[tool.pytest.ini_options]
# Emit stack traces during CI hangs before GitHub's 15-minute pytest step
# timeout. This is diagnostics-only; it does not change pytest pass/fail logic.
faulthandler_timeout = "120"

[tool.coverage.run]
# pytest-cov 7 delegates subprocess measurement to coverage.py.
patch = ["subprocess"]

[project.scripts]
ardur = "vibap.cli:main"
ardur-verify = "vibap.cli:verify_main"
ardur-drp-fixtures = "vibap.drp_conformance:main"
ardur-policy-conformance = "vibap.policy_conformance:main"
# Deprecated alias retained for one release cycle to ease migration
# from the legacy CLI name; emits a deprecation warning on use.
ardur-proxy = "vibap.cli:main"

[project.urls]
Homepage = "https://github.com/ArdurAI/ardur-evidence"
Documentation = "https://github.com/ArdurAI/ardur-evidence/tree/main/docs"
Repository = "https://github.com/ArdurAI/ardur-evidence"
Issues = "https://github.com/ArdurAI/ardur-evidence/issues"
Discussions = "https://github.com/ArdurAI/ardur-evidence/discussions"

[tool.setuptools.packages.find]
include = ["vibap*"]

# Ship the embedded spec schemas (under vibap/_specs/) so that
# jsonschema-based validation of Mission Declarations works after a
# plain `pip install ardur` — the runtime cannot rely on the source
# docs/specs/ directory being on disk.
[tool.setuptools.package-data]
"vibap._specs" = ["*.json"]
"vibap._vendor.rfc8785" = ["LICENSE", "UPSTREAM.md"]
"vibap" = [
    "_plugins/claude-code/.claude-plugin/*.json",
    "_plugins/claude-code/hooks/*",
]
