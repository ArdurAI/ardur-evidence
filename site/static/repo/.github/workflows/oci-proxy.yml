name: oci-proxy

on:
  push:
    branches: [main, dev]
    paths:
      - ".github/workflows/oci-proxy.yml"
      - "Dockerfile.proxy"
      - "packaging/oci/**"
      - "python/**"
      - "scripts/validate-oci-release.py"
      - "scripts/verify-mvp.sh"
      - "scripts/verify-proxy-image.sh"
  pull_request:
    branches: [main, dev]
    paths:
      - ".github/workflows/oci-proxy.yml"
      - "Dockerfile.proxy"
      - "packaging/oci/**"
      - "python/**"
      - "scripts/validate-oci-release.py"
      - "scripts/verify-mvp.sh"
      - "scripts/verify-proxy-image.sh"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/ardurai/ardur-proxy
  TRIVY_VERSION: v0.72.0

jobs:
  validate:
    name: Validate OCI release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.13"

      - name: Validate static image contract
        run: python scripts/validate-oci-release.py

      - name: Verify release tag and main ancestry
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python scripts/validate-oci-release.py --expected-tag "$RELEASE_TAG"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  proxy-smoke:
    name: Hardened proxy image smoke and scan
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Resolve package version
        id: version
        run: echo "version=$(python3 scripts/validate-oci-release.py --print-version)" >> "$GITHUB_OUTPUT"

      - name: Build native proxy image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.proxy
          load: true
          platforms: linux/amd64
          tags: ardur-proxy:ci-${{ github.sha }}
          build-args: |
            OCI_VERSION=${{ steps.version.outputs.version }}
            OCI_REVISION=${{ github.sha }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=oci-proxy-native
          cache-to: type=gha,mode=max,scope=oci-proxy-native

      - name: Run read-only authenticated lifecycle
        run: scripts/verify-proxy-image.sh "ardur-proxy:ci-${GITHUB_SHA}"

      - name: Create security artifact directory
        run: mkdir -p .artifacts/oci-proxy

      - name: Generate SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ardur-proxy:ci-${{ github.sha }}
          format: spdx-json
          output: .artifacts/oci-proxy/ardur-proxy.spdx.json
          scanners: vuln
          version: ${{ env.TRIVY_VERSION }}

      - name: Record complete vulnerability and secret report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ardur-proxy:ci-${{ github.sha }}
          format: json
          output: .artifacts/oci-proxy/trivy.json
          scanners: vuln,secret
          exit-code: "0"
          skip-setup-trivy: "true"
          version: ${{ env.TRIVY_VERSION }}

      - name: Store SBOM and complete scan report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: oci-proxy-security-${{ github.sha }}
          path: .artifacts/oci-proxy/
          if-no-files-found: error
          retention-days: 14

      - name: Reject fixable HIGH or CRITICAL findings and embedded secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ardur-proxy:ci-${{ github.sha }}
          format: table
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          skip-setup-trivy: "true"
          version: ${{ env.TRIVY_VERSION }}

  release-platform:
    name: Stage and scan ${{ matrix.platform }} release digest
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: [validate, proxy-smoke]
    runs-on: ubuntu-latest
    environment:
      name: ghcr
      url: https://github.com/ArdurAI/ardur/pkgs/container/ardur-proxy
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            artifact: linux-amd64
          - platform: linux/arm64
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve package version
        id: version
        run: echo "version=$(python3 scripts/validate-oci-release.py --print-version)" >> "$GITHUB_OUTPUT"

      - name: Build and stage immutable platform digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: Dockerfile.proxy
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            OCI_VERSION=${{ steps.version.outputs.version }}
            OCI_REVISION=${{ github.sha }}
            OCI_SOURCE=${{ github.server_url }}/${{ github.repository }}
          attests: |
            type=provenance,mode=max
            type=sbom,generator=docker/buildkit-syft-scanner:stable-1@sha256:79e7b013cbec16bbb436f312819a49a4a57752b2270c1a9332ae1a10fcc82a68
          cache-from: type=gha,scope=oci-proxy-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=oci-proxy-${{ matrix.artifact }}

      - name: Create platform security artifact directory
        run: mkdir -p .artifacts/oci-proxy-release

      - name: Record final platform scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: json
          output: .artifacts/oci-proxy-release/trivy-${{ matrix.artifact }}.json
          scanners: vuln,secret
          exit-code: "0"
          version: ${{ env.TRIVY_VERSION }}

      - name: Store final platform scan
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: oci-release-security-${{ matrix.artifact }}
          path: .artifacts/oci-proxy-release/
          if-no-files-found: error
          retention-days: 30

      - name: Gate final platform digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: "true"
          exit-code: "1"
          skip-setup-trivy: "true"
          version: ${{ env.TRIVY_VERSION }}

      - name: Record scanned digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p /tmp/oci-digests
          touch "/tmp/oci-digests/${IMAGE_DIGEST#sha256:}"

      - name: Store scanned digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: oci-digest-${{ matrix.artifact }}
          path: /tmp/oci-digests/
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish reviewed multi-platform manifest
    if: github.event_name == 'release' && github.event.release.prerelease == false
    needs: release-platform
    runs-on: ubuntu-latest
    environment:
      name: ghcr
      url: https://github.com/ArdurAI/ardur/pkgs/container/ardur-proxy
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0  # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Retrieve scanned platform digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: oci-digest-*
          path: /tmp/oci-digests
          merge-multiple: true

      - name: Publish immutable version tags
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python3 scripts/validate-oci-release.py --print-version)"
          mapfile -t DIGESTS < <(find /tmp/oci-digests -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${#DIGESTS[@]}" -eq 2
          REFS=()
          for digest in "${DIGESTS[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            REFS+=("${IMAGE_NAME}@sha256:${digest}")
          done
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${RELEASE_TAG}" \
            --tag "${IMAGE_NAME}:${VERSION}" \
            "${REFS[@]}"

      - name: Verify public manifest and record digest
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python3 scripts/validate-oci-release.py --print-version)"
          docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" --raw > /tmp/manifest.json
          jq -e '[.manifests[].platform | select(.os == "linux") | (.os + "/" + .architecture)] | sort == ["linux/amd64", "linux/arm64"]' /tmp/manifest.json
          RELEASE_DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:${RELEASE_TAG}" --format '{{json .Manifest}}' | jq -r .digest)"
          VERSION_DIGEST="$(docker buildx imagetools inspect "${IMAGE_NAME}:${VERSION}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$RELEASE_DIGEST" = "$VERSION_DIGEST"
          {
            echo "### Ardur proxy OCI release"
            echo
            echo "- Image: \`${IMAGE_NAME}@${RELEASE_DIGEST}\`"
            echo "- Tags: \`${RELEASE_TAG}\`, \`${VERSION}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
