name: dependabot-workflow-mirrors

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
    paths:
      - ".github/workflows/*.yml"

# The workflow prepares a narrow generated-artifact commit, then explicitly
# dispatches protected checks because pushes made with GITHUB_TOKEN do not
# create normal push or pull_request workflow runs.
permissions:
  actions: write
  contents: write

concurrency:
  group: dependabot-workflow-mirrors-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/github_actions/')
    runs-on: ubuntu-latest
    steps:
      # pull_request_target is privileged, so start from the trusted base. The
      # helper reads workflow blobs from the bot commit as data; it never runs
      # code from the pull-request checkout before creating the mirror commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: "0"
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Prepare the generated workflow mirrors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 scripts/sync-dependabot-workflow-mirrors.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA"

      - name: Commit and push only generated mirrors
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Workflow mirrors are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): sync workflow mirrors"
          git push origin "HEAD:refs/heads/$HEAD_REF"

      # workflow_dispatch is the documented GITHUB_TOKEN recursion exception.
      # Re-run exactly the protected checks on the new head; no release or
      # publishing workflow is dispatched.
      - name: Dispatch protected checks on the mirror commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          REQUIRED_WORKFLOWS: |
            codeql.yml
            hugo-site.yml
            link-check.yml
            secret-scan.yml
            tests.yml
            validate-formats.yml
        run: |
          set -euo pipefail
          expected_sha="$(git rev-parse HEAD)"
          CHECK_REF="dependabot-workflow-mirrors/pr-${PR_NUMBER}-run-${RUN_ID}-${expected_sha}"
          cleanup_check_ref() {
            git push origin ":refs/tags/$CHECK_REF" >/dev/null 2>&1 || true
          }
          trap cleanup_check_ref EXIT
          git push origin "$expected_sha:refs/tags/$CHECK_REF"
          while IFS= read -r workflow; do
            if [ -n "$workflow" ]; then
              remote_sha="$(git ls-remote origin "refs/heads/$HEAD_REF" | cut -f1)"
              if [ "$remote_sha" != "$expected_sha" ]; then
                echo "::error::Dependabot branch moved before protected checks were dispatched."
                exit 1
              fi
              if [ "$workflow" = "tests.yml" ]; then
                gh workflow run "$workflow" --ref "$CHECK_REF" -f recheck_mode=secretless
              else
                gh workflow run "$workflow" --ref "$CHECK_REF"
              fi
              run_id=""
              for _ in $(seq 1 30); do
                run_id="$(
                  gh run list \
                    --workflow "$workflow" \
                    --event workflow_dispatch \
                    --branch "$CHECK_REF" \
                    --commit "$expected_sha" \
                    --limit 1 \
                    --json databaseId \
                    --jq '.[0].databaseId // empty'
                )"
                if [ -n "$run_id" ]; then
                  break
                fi
                sleep 2
              done
              if [ -z "$run_id" ]; then
                echo "::error::Protected workflow $workflow did not materialize before tag cleanup."
                exit 1
              fi
              echo "Dispatched $workflow as run $run_id on $expected_sha."
            fi
          done <<< "$REQUIRED_WORKFLOWS"
          trap - EXIT
          git push origin ":refs/tags/$CHECK_REF"
